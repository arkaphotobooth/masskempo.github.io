<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Panitia | MASS KEMPO</title>
    <link rel="stylesheet" href="assets/css/global.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-placeholder">MASS KEMPO</div>
            <h2 class="login-title">Portal Panitia</h2>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username / ID Peran</label>
                    <input type="text" id="username" required placeholder="Masukkan username">
                </div>

                <div class="input-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" required placeholder="Masukkan kata sandi">
                </div>

                <div id="errorMessage" class="error-message"></div>

                <button type="submit" id="loginBtn" class="btn-primary">Masuk</button>
            </form>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>

</html>
